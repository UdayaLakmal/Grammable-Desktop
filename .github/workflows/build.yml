# Builds and tests Grammable on Windows and Linux, and keeps the installers
# as downloadable artifacts (Actions › run › Artifacts).
name: Build

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build installer
        run: npx --yes @tauri-apps/cli@^2 build --bundles nsis
      - name: Sizes
        shell: bash
        run: |
          ls -l target/release/grammable.exe target/release/bundle/nsis/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: grammable-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libxtst-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace
      - name: Build packages
        run: npx --yes @tauri-apps/cli@^2 build --bundles deb
      - name: Sizes
        run: ls -l target/release/grammable target/release/bundle/deb/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: grammable-linux
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error
